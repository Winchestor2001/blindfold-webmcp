<!doctype html>
<meta charset="utf-8">
<title>Blindfold thumbnail</title>
<style>
  :root {
    --ink: #0b0d10;
    --panel: #14181d;
    --line: #232a32;
    --muted: #8b97a6;
    --agent: #7c9cff;
    --human: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; }
  body {
    background:
      radial-gradient(900px 500px at 82% 12%, rgba(124,156,255,.12), transparent 60%),
      var(--ink);
    color: #e6ebf2;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 76px;
    position: relative;
    overflow: hidden;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--agent);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 9px 16px;
    border-radius: 999px;
    margin-bottom: 30px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--human); }

  h1 {
    font-size: 108px;
    line-height: 1;
    letter-spacing: -.035em;
    font-weight: 700;
    margin-bottom: 22px;
  }

  .tagline {
    font-size: 34px;
    line-height: 1.3;
    font-weight: 400;
    color: #cdd6e2;
    max-width: 900px;
    margin-bottom: 42px;
  }
  .tagline b { color: #fff; font-weight: 700; }

  .preview {
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 14px;
    padding: 22px 26px;
    max-width: 1010px;
  }
  .label {
    font-size: 15px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .line {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 25px;
    line-height: 1.45;
    color: #dce4ee;
    white-space: nowrap;
  }
  .block { color: #4a5563; letter-spacing: -.5px; }

  .foot {
    position: absolute;
    left: 76px;
    bottom: 44px;
    font-size: 21px;
    color: var(--muted);
  }
  .foot span { color: var(--human); }
</style>
<div class="badge"><i class="dot"></i>WebMCP · 14 tools in the page</div>
<h1>Blindfold</h1>
<p class="tagline">An agent redacts a document it is<br><b>not allowed to read.</b></p>
<div class="preview">
  <div class="label">What the agent actually receives</div>
  <div class="line">PERSON · p.1 · "From: Dr.&nbsp;<span class="block">████████████</span>, Chief Risk Officer"</div>
</div>
<div class="foot">Every real value waits for a <span>human click</span>.</div>
